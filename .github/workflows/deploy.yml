name: Deploy Ecommerce to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'Ecommerce/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'Ecommerce/package-lock.json'
      - run: cd Ecommerce && npm ci
      - run: cd Ecommerce && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'Ecommerce/dist'
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
