<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects - Ecommerce</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 3rem;
            text-align: center;
            max-width: 500px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 1rem;
        }
        
        p {
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .redirect-message {
            background: #f0f4ff;
            padding: 1.5rem;
            border-radius: 8px;
            margin: 2rem 0;
            color: #667eea;
            font-weight: 500;
        }
        
        .button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            border: none;
            font-size: 1rem;
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .loading {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛍️ Ecommerce Project</h1>
        <p>Welcome! Your ecommerce website is being deployed...</p>
        
        <div class="redirect-message">
            Redirecting to your live website in 3 seconds...
        </div>
        
        <button class="button" onclick="goToEcommerce()">
            Go to Ecommerce Website →
        </button>
        
        <div class="loading">
            If not redirected automatically, click the button above
        </div>
    </div>
    
    <script>
        function goToEcommerce() {
            window.location.href = 'https://susmitab277.github.io/My-Projects/Ecommerce/';
        }
        
        // Auto redirect after 3 seconds
        setTimeout(goToEcommerce, 3000);
    </script>
</body>
</html>
